[project]
name = "cherab-nagdis"
description = "Cherab for NAGDIS-II"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Koyo Munechika", email = "munechika.koyo@gmail.com" },
]
keywords = ["cherab", "fusion", "inversion", "nagdis", "plasma"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "calcam",
  "cherab>=1.5,<2.0",
  "matplotlib",
  "numpy",
  "paramiko",
  "plotly",
  "pooch",
  "rich",
  "scipy",
  "tqdm",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/munechika-koyo/cherab_nagdis"

[build-system]
requires = ["cherab>=1.5,<2.0", "hatch-cython>=0.6.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.cibuildwheel]
skip = "pp* *_ppc64le *_i686 *_s390x *-musllinux* cp313* cp314* cp315*"
build-frontend = "build[uv]"
test-requires = ["pytest", "pytest-cov"]
test-command = "pytest {project}/tests"

[tool.coverage.run]
source_pkgs = ["cherab.nagdis"]
branch = true
parallel = true

[tool.coverage.paths]
test = ["src/test", "*/test/src/test"]
tests = ["tests", "*/test/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.cython-lint]
max-line-length = 120

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.vcs]

[tool.hatch.build.targets.wheel]
packages = ["src/cherab"]
artifacts = ["*.so", "*.dll", "*.dylib"]
exclude = ["*.pyx"]

[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
include_numpy = true
src = "cherab"
compile_args = ["-O3"]
compile_py = false

[tool.hatch.build.targets.wheel.hooks.cython.options.files]
targets = ["**/*.pyx"]

[tool.pyrefly]
project-includes = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=cherab_nagdis --cov-report term-missing --no-cov-on-fail"
minversion = "6.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "B",  # flake8-bugbear
  "F",  # pyflakes
  "I",  # isort (import order)
  "N",  # pep8-naming
  "W",  # Warning
  "UP",  # pyupgrade
  "NPY",  # numpy specific rules
  "D",  # pydocstyle
  "DOC",  # pydoclint
]
preview = true
ignore = [
  # Recommended ignores by ruff when using formatter
  "E501",  # line too long
  "N802",  # function name should be lowercase
  "N803",  # argument name should be lowercase
  "N806",  # variable in function should be lowercase
  "D107",  # missing docstring in __init__
]

[tool.ruff.lint.isort]
known-first-party = ["cherab"]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = [
  "W292",
  "D",
  "DOC",
]  # no newline at end of file and skip docstring checks
"tests/**" = ["D", "DOC"]  # skip docstring checks in tests

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.tombi]
toml-version = "v1.1.0"

[tool.typos.files]
extend-exclude = [".git/", ".pixi/", "notebooks/"]
ignore-hidden = false

[tool.typos.default.extend-words]
iy = "iy"
rto = "rto"
emiss = "emiss"
