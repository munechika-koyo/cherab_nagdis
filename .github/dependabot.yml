version: 2

# Keep routine dependency updates reviewable as one weekly change per ecosystem.
# Dependabot does not currently support dependencies declared in pixi.toml.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-dependencies-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-dependencies-major:
        patterns:
          - "*"
        update-types:
          - major
